<ul class="blog-post-list">
  {% for post in paginator.posts %}
    {% if post.draft != true %}
      <li class="blog-post-entry">
        <span class="blog-post-date">{{ post.date | date: "%y/%m/%d" }}</span>
        <a href="{{ post.url | replace:".html","" | prepend: site.baseurl }}" class="blog-post-title">
          {{- post.title -}}
        </a>
        {% if post.tags.size > 0 %}
          <span class="blog-post-tags">
            {% for tag in post.tags %}
              <a href="{{ site.baseurl }}/tag/{{ tag | slugify }}/" class="blog-post-tag">#{{ tag }}</a>
            {% endfor %}
          </span>
        {% endif %}
      </li>
    {% endif %}
  {% endfor %}
</ul>
